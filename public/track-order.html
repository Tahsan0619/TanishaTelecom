<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order | {site}</title>
    <link rel="icon" type="image/png" href="assets/images/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=9">
</head>
<body data-page="track">
<div id="site-header"></div>

<main class="page">
    <div class="container" style="max-width:900px">
        <div class="breadcrumb"><a href="index.html">Home</a><span>/</span>Track Order</div>
        <div id="orderResult"></div>
        <div class="box" id="trackBox">
            <h1 class="page-title">Track your order</h1>
            <p class="text-muted" style="margin-top:-12px">Enter your order number and the mobile number used at checkout.</p>
            <form id="trackForm" novalidate>
                <div data-form-alert class="hidden"></div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Order number <span class="req">*</span></label>
                        <input class="form-control" name="order_number" placeholder="TT-XXXXXX-XXXXX" required>
                    </div>
                    <div class="form-group">
                        <label>Mobile number <span class="req">*</span></label>
                        <input class="form-control" name="phone" type="tel" placeholder="01XXXXXXXXX" required>
                    </div>
                </div>
                <button class="btn" type="submit"><i class="fa-solid fa-magnifying-glass"></i> Track order</button>
            </form>
        </div>
    </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/config.js?v=9"></script>
<script src="assets/js/app.js?v=9"></script>
<script src="assets/js/order-view.js?v=9"></script>
<script src="assets/js/pages/track.js?v=9"></script>
</body>
</html>
